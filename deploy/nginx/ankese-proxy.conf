proxy_pass http://127.0.0.1:3200;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $ankese_ip;
proxy_set_header X-Forwarded-For $ankese_ip;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_read_timeout 15s;
proxy_connect_timeout 3s;
# guvenlik basliklarini uygulama verir (nginx burada add_header kullanirsa ust seviye basliklar miras alinmaz)
