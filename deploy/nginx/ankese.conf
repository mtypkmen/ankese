server {
    server_name ankese.com;
    root /var/www/ankese/public;
    index index.html;

    server_tokens off;
    client_max_body_size 1k;
    limit_req_status 429;
    limit_conn_status 429;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 15s;
    keepalive_timeout 15s;
    limit_req zone=ankese_req burst=30 nodelay;
    limit_conn ankese_conn 20;

    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;

    error_page 404 /404.html;


    # dotfile ve yedek dosyalar
    location ~ /\. { return 404; }
    location ~* \.(bak|old|orig|sql|log|env|git|md|conf|sh)$ { return 404; }

    # Express uygulamasi: saglik kontrolu + kimlik sayfalari (POST dahil)
    location = /healthz {
        include snippets/ankese-proxy.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    location ~ ^/(regjistrohu|hyr|dil|verifiko|ridergo|harrova|rivendos|profili|kontakt|shkruaj(/.*)?|en/(register|login|logout|verify|resend|forgot|reset|profile|contact|write(/.*)?))/?$ {
        limit_req zone=ankese_auth burst=10 nodelay;
        client_max_body_size 8k;
        include snippets/ankese-proxy.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Ana sayfa (dinamik) - Express kapaliysa statik sayfaya geri dus
    location = / {
        include snippets/ankese-proxy.conf;
        add_header Vary "Accept-Encoding" always;
        error_page 502 503 504 = @home_sq;
    }
    location = /en/ {
        include snippets/ankese-proxy.conf;
        add_header Vary "Accept-Encoding" always;
        error_page 502 503 504 = @home_en;
    }
    location @home_sq { root /var/www/ankese/public; rewrite ^ /index.html break; include snippets/ankese-sec-headers.conf; }
    location @home_en { root /var/www/ankese/public; rewrite ^ /en/index.html break; include snippets/ankese-sec-headers.conf; }

    # Hukuki sayfalar + sitemap (dinamik)
    location ~ ^/(kushtet|privatesia|rregullat|cookies|sitemap\.xml|en/(terms|privacy|rules|cookies))$ {
        include snippets/ankese-proxy.conf;
        add_header Vary "Accept-Encoding" always;
    }

    # Herkese acik katalog sayfalari (sirket, sektor, sehir, arama, sikayet detayi)
    location ~ ^/(kompani|sektori|qyteti|kerko|en/(company|category|city|search))(/.*)?$ {
        include snippets/ankese-proxy.conf;
        # location icinde add_header olmali ki ust seviye basliklar miras alinip uygulamaninkilerle cakismasin
        add_header Vary "Accept-Encoding" always;
    }

    location /assets/ {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public" always;
        # location'da add_header miras almaz, basliklari tekrar yaz
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    }

    location / {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    }

    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/ankese.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ankese.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# www -> apex
server {
    server_name www.ankese.com;
    server_tokens off;
    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/ankese.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ankese.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://ankese.com$request_uri;
}

# http -> https
server {
    listen 80;
    listen [::]:80;
    server_name ankese.com www.ankese.com panel.ankese.com;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; default_type text/plain; }
    location / { return 301 https://$host$request_uri; }
}

# panel.ankese.com: yonetim paneli (Express). Her sey uygulamaya gider; panel tarafinda kendi oturumu/2FA'si var.
server {
    server_name panel.ankese.com;
    server_tokens off;
    client_max_body_size 16k;
    limit_req_status 429;
    limit_req zone=ankese_panel burst=40 nodelay;
    limit_conn ankese_conn 20;
    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/ankese.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ankese.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        include snippets/ankese-proxy.conf;
    }
}
