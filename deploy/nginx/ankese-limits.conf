# ankese.com: Cloudflare arkasinda gercek ziyaretci IP'si (global real_ip degistirmeden)
map $http_cf_connecting_ip $ankese_client {
    default $http_cf_connecting_ip;
    ""      $binary_remote_addr;
}
limit_req_zone  $ankese_client zone=ankese_req:10m rate=10r/s;
limit_conn_zone $ankese_client zone=ankese_conn:10m;
limit_req_zone  $ankese_client zone=ankese_auth:10m rate=1r/s;

# basliklara yazilacak, okunabilir (metin) IP
map $http_cf_connecting_ip $ankese_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}
limit_req_zone  $ankese_client zone=ankese_panel:10m rate=8r/s;
